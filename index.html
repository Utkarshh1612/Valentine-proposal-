<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💖</title>
<style>
body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff4d6d, #ff758f);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    overflow: hidden;
}
.card {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    max-width: 360px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}
h1 {
    font-size: 26px;
    margin-bottom: 20px;
}
button {
    padding: 12px 30px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    margin: 10px;
}
#yesBtn { background: #2ecc71; color: white; }
#noBtn { background: #e74c3c; color: white; }
</style>
</head>
<body>

<div class="card" id="card">
    <h1>Palak, will you be my Valentine? 💖</h1>
    <button id="yesBtn" onclick="yesClicked()">Yes 💕</button>
    <button id="noBtn" onclick="noClicked()">No 😅</button>
</div>

<script>
function yesClicked() {
    document.getElementById("card").innerHTML = `
        <h1>YAYYYYY! 💖🎉</h1>
        <p>I am soooo happyyyy 🥺❤️</p>
    `;
}

function noClicked() {
    document.getElementById("card").innerHTML = `
        <h1>Oops 😜</h1>
        <p>Try again… you can’t say no 😌💖</p>
        <button id="yesBtn" onclick="yesClicked()">Yes 💕</button>
    `;
}
</script>

</body>
</html>
