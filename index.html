<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body { 
            text-align: center; 
            font-family: 'Comic Sans MS', cursive, sans-serif; 
            background-color: #ffeef2; 
            padding-top: 50px; 
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            display: inline-block; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
            position: relative;
            max-width: 90%;
        }
        h1 { 
            color: #ff4d6d; 
            margin: 20px 0;
        }
        .btn { 
            font-size: 20px; 
            padding: 12px 30px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            margin: 15px; 
            transition: all 0.3s;
            font-weight: bold;
        }
        #yesBtn { 
            background-color: #ff4d6d; 
            color: white; 
        }
        #yesBtn:hover {
            background-color: #ff3366;
            transform: scale(1.08);
        }
        #noBtn { 
            background-color: #888; 
            color: white; 
            position: absolute;
        }
        #noBtn:hover {
            background-color: #777;
        }
        img { 
            width: 220px; 
            border-radius: 15px; 
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGZ4bmZ4bmZ4bmZ4bmZ4bmZ4bmZ4bmZ4bmZ4bmZ4bmZ4bmZ4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/26hp8uO78u572Y/giphy.gif" alt="Cute animated cat">
        <h1>Will you be my Valentine?</h1>
        <button class="btn" id="yesBtn" onclick="alert('Yayyyy! â¤ï¸ See you on the 14th!');">
            YES
        </button>
        <button class="btn" id="noBtn" onmouseover="moveButton()">
            NO
        </button>
    </div>

    <script>
        function moveButton() {
            const btn = document.getElementById('noBtn');
            const maxX = window.innerWidth - btn.offsetWidth - 40;
            const maxY = window.innerHeight - btn.offsetHeight - 40;
            
            const x = Math.random() * maxX;
            const y = Math.random() * maxY;
            
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        // Optional: make it harder by moving when trying to click
        document.getElementById('noBtn').addEventListener('click', function(e) {
            e.preventDefault();
            moveButton();
        });
    </script>
</body>
</html>
