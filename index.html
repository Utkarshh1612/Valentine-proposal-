<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Palak ❤️</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff4d6d, #ff758f);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.card {
    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(12px);
    padding: 30px;
    border-radius: 22px;
    text-align: center;
    max-width: 390px;
    width: 90%;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
}

h1 {
    font-size: 26px;
    margin-bottom: 15px;
}

p {
    font-size: 17px;
}

button {
    padding: 12px 32px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    margin: 10px;
}

#yesBtn {
    background: #2ecc71;
    color: white;
}

#noBtn {
    background: #e74c3c;
    color: white;
}

.date {
    background: rgba(255,255,255,0.28);
    padding: 16px;
    border-radius: 18px;
    margin: 14px 0;
    cursor: pointer;
    font-size: 16px;
}

/* Letter Page */
.letter-page {
    max-width: 430px;
    width: 95%;
}

.letter {
    background: url("letter.jpg") no-repeat center/cover;
    padding: 40px 25px;
    border-radius: 14px;
    color: #3b2f2f;
    font-family: "Georgia", serif;
    min-height: 520px;
}

#letterText {
    font-size: 15px;
    line-height: 1.8;
    white-space: pre-line;
}
</style>
</head>
<body>

<div class="card" id="card">
    <h1>Palak, will you be my Valentine? 💖</h1>
    <button id="yesBtn" onclick="yesClicked()">Yes 💕</button>
    <button id="noBtn" onclick="noClicked()">No 😅</button>
</div>

<script>
function yesClicked() {
    document.getElementById("card").innerHTML = `
        <h1>Yayyy Palak 💖</h1>
        <p>Choose our date 😌</p>

        <div class="date" onclick="showLetter()">☕ Cafe Date</div>
        <div class="date" onclick="showLetter()">🎬 Movie Date</div>
        <div class="date" onclick="showLetter()">🚶‍♂️🎶 Walking + Music</div>
    `;
}

function noClicked() {
    document.getElementById("card").innerHTML = `
        <h1>Nice try 😜</h1>
        <p>Par ishq toh bula chuka hai 💖</p>
        <button id="yesBtn" onclick="yesClicked()">Yes 💕</button>
    `;
}

function showLetter() {
    document.getElementById("card").outerHTML = `
        <div class="letter-page">
            <div class="letter">
                <div id="letterText"></div>
            </div>
        </div>
    `;
    typeWriter();
}

const letter = `Palakkk agar aap yeh page tak aaye hoo iska matlab you accepted my proposal aur shayad yeh sahi waqt hai tujhe meri feelings batane ka.

Palak dekh, ik ki hum abhi relationship mein nahi hai, tu meri girlfriend nahi hai, par tu mere liye usse kahin zyada important hai.

Tu meri zindagi ki woh khushi hai Palak,
jo mujhe bina dhoonde mil gayi.
Haan, kabhi kabhi thoda dard bhi saath laati ho,
par us dard mein bhi ek apnapan hota hai
aur mujhe wahi apnapan chahiye.

Main zyada dhyaan un baaton pe deta hoon
jo dil ko sukoon deti hain
aur sach kahun toh,
teri baatein hi meri sabse jada sukoon deti hain🫶🏻

Palak, tu bahot achi hai.
Mujhe pata hai teri life ne tujhe
kai baar yeh mehsoos karaya hai
ki shayad tu kaafi nahi hai
par mere liye,
tu hamesha se hi kaafi se zyada rahi hai.

Mujhe tere mein sab kuch pasand hai
tera bolna, tera chup rehna,
teri aankhon ka sach,
aur woh poori tu
jo bina koshish ke hi mera dil jeet leti hai.

Aur ek baat, kitna bhi mana karu
par mujhe pyaari Palak bahot pasand hai
waise hi ho jaa tu 😭🫶🏻

Aur end mein sirf ek baat kehna chahunga
cheezo se mat bhaag
mujhse mat bhaag
meri ho jaa
itna pyaar karunga
jitna kabhi kisi se nahi kiya ho.

I love you Palak 🫶🏻❤️
Aur main chahta hoon
ki tu hamesha meri rahe 🫶🏻`;

let i = 0;
function typeWriter() {
    if (i < letter.length) {
        document.getElementById("letterText").innerHTML += letter.charAt(i);
        i++;
        setTimeout(typeWriter, 35);
    }
}
</script>

</body>
</html>
