<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff4d6d, #ff758f);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    overflow: hidden;
}

.card {
    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(12px);
    padding: 30px;
    border-radius: 22px;
    text-align: center;
    max-width: 390px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
}

.date {
    background: rgba(255,255,255,0.28);
    padding: 16px;
    border-radius: 18px;
    margin: 14px 0;
    cursor: pointer;
}

/* Letter Page */
.letter-page {
    max-width: 420px;
}

.letter {
    background: url("letter.jpg") no-repeat center/cover;
    padding: 40px 25px;
    color: #3b2f2f;
    font-family: Georgia, serif;
    border-radius: 12px;
    min-height: 500px;
}

#letterText {
    font-size: 15px;
    line-height: 1.7;
    white-space: pre-line;
}
</style>
</head>
<body>

<div class="card" id="card">
    <h1>Palak, will you be my Valentine? 💖</h1>
    <button onclick="yesClicked()">Yes 💕</button>
</div>

<script>
function yesClicked() {
    document.getElementById("card").innerHTML = `
        <h2>Choose our date 😌</h2>
        <div class="date" onclick="showLetter()">🚶‍♂️🎶 Walking + Music</div>
    `;
}

function showLetter() {
    document.getElementById("card").outerHTML = `
        <div class="letter-page">
            <div class="letter">
                <div id="letterText"></div>
            </div>
        </div>
    `;
    typeWriter();
}

const text = `Palakkk agar aap yeh page tak aaye hoo iska matlab you accepted my proposal aur shayad yeh sahi waqt hai tujhe meri feelings batane ka.

Palak dekh, ik ki hum abhi relationship mein nahi hai, tu meri girlfriend nahi hai, par tu mere liye usse kahin zyada important hai.

Tu meri zindagi ki woh khushi hai jo main dhoond raha tha. Haan, thoda dard bhi laati tu, par woh chalega. Main zyada dhyaan un baaton pe deta hoon jo acchi ho — matlab teri baatein 🫶🏻

Palak, tu bahot achi hai. Mujhe pata hai tere life mein bahot kuch hua hai jinki wajah se tujhe lagta hai tu achi nahi hai, par tu hai.

Mujhe tere mein sab kuch pasand hai — teri baatein, teri aankhein, poori tu… sab kuch Palak.

I love you so much ❤️  
Aur main chahta hoon ki main hamesha tere saath rahoon 🫶🏻`;

let i = 0;
function typeWriter() {
    if (i < text.length) {
        document.getElementById("letterText").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 40); // typing speed
    }
}
</script>

</body>
</html>
