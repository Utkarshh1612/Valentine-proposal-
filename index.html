<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff4d6d, #ff758f);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    overflow: hidden;
}

/* Floating Hearts */
.heart {
    position: absolute;
    font-size: 22px;
    opacity: 0.8;
    animation: float 6s infinite ease-in;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

.card {
    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(12px);
    padding: 30px;
    border-radius: 22px;
    text-align: center;
    max-width: 390px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    animation: fadeIn 0.6s ease;
    position: relative;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

h1 {
    font-size: 26px;
    margin-bottom: 15px;
}

p {
    font-size: 17px;
    margin-bottom: 15px;
}

button {
    padding: 12px 32px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    margin: 10px;
    transition: transform 0.2s ease;
}

button:hover {
    transform: scale(1.1);
}

#yesBtn {
    background: #2ecc71;
    color: white;
}

#noBtn {
    background: #e74c3c;
    color: white;
}

/* Clickable Date Cards */
.date {
    background: rgba(255,255,255,0.28);
    padding: 16px;
    border-radius: 18px;
    margin: 14px 0;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
}

.date:hover {
    transform: scale(1.05);
    background: rgba(255,255,255,0.38);
}

/* Popup */
.popup {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

.popup-content {
    background: #ff758f;
    padding: 25px;
    border-radius: 20px;
    max-width: 320px;
    text-align: center;
    animation: fadeIn 0.4s ease;
}
</style>
</head>
<body>

<!-- Hidden YouTube Music -->
<iframe id="music" width="0" height="0" src="" allow="autoplay"></iframe>

<div class="card" id="card">
    <h1>Palak, will you be my Valentine? 💖</h1>
    <button id="yesBtn" onclick="yesClicked()">Yes 💕</button>
    <button id="noBtn" onclick="noClicked()">No 😅</button>
</div>

<!-- Popup -->
<div class="popup" id="popup">
    <div class="popup-content">
        <p id="popupText"></p>
        <button id="yesBtn" onclick="closePopup()">Okay 💖</button>
    </div>
</div>

<script>
/* Hearts */
for (let i = 0; i < 18; i++) {
    let h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "💖";
    h.style.left = Math.random() * 100 + "vw";
    h.style.animationDuration = (Math.random() * 3 + 4) + "s";
    document.body.appendChild(h);
}

function yesClicked() {
    document.getElementById("music").src =
        "https://www.youtube.com/embed/KY1G8S9v5U8?autoplay=1&loop=1&playlist=KY1G8S9v5U8";

    document.getElementById("card").innerHTML = `
        <h1>YAYYYYY Palak 💖</h1>
        <p>Choose our first date 😌✨</p>

        <div class="date" onclick="selectDate('cafe')">
            ☕ <b>Cafe Date</b><br>
            Coffee, baatein & slow smiles 💕
        </div>

        <div class="date" onclick="selectDate('movie')">
            🎬 <b>Movie Date</b><br>
            Popcorn, dark hall & stolen glances ❤️
        </div>

        <div class="date" onclick="selectDate('walk')">
            🚶‍♂️🎶 <b>Walking Date</b><br>
            Haath mein haath, ek hi earphone 🌙💞
        </div>
    `;
}

function selectDate(type) {
    let text = "";

    if (type === "cafe") {
        text = "☕ Sooo coffee date it is Palak 💖<br>Coffee thandi ho jaaye, par baatein kabhi khatam na ho 😌✨";
    } 
    else if (type === "movie") {
        text = "🎬 Movie date it is 💕<br>Screen pe movie, aur mere liye sirf tum ❤️🍿";
    } 
    else {
        text = "🚶‍♂️🎶 Walking date it is 🌙<br>Haath mein haath, Ishq Bulaava earphones mein & duniya slow ho jaaye 💞";
    }

    document.getElementById("popupText").innerHTML = text;
    document.getElementById("popup").style.display = "flex";
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}

function noClicked() {
    document.getElementById("card").innerHTML = `
        <h1>Nice try 😜</h1>
        <p>Par aaj choice sirf ek hi hai 😌💖</p>
        <button id="yesBtn" onclick="yesClicked()">Yes 💕</button>
    `;
}
</script>

</body>
</html>
